<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="form-container">
      <div id="form-header">
        <h1 id="form-title">Formulier vragen / suggesties</h1>
        <p>
          <strong
            >Vul het onderstaande formulier voor vragen of suggesties.</strong
          >
        </p>
      </div>
      <form>
        <label for="name">Je naam:<span class="required"> *</span></label>
        <input type="text" id="name" name="name" required />
        <p>Geef je naam en voornaam op</p>

        <label for="email"
          >E-mailadres ucll:<span class="required"> *</span></label
        >
        <input type="email" id="email" name="email" required />
        <p>Geef je e-mailadres op</p>

        <label for="choice"
          >Kies een optie:<span class="required"> *</span></label
        >
        <select id="choice" name="choice">
          <option value="question">Vraag</option>
          <option value="suggestion">Suggestie</option>
        </select>

        <label for="message"
          >Jouw vraag / suggestie:<span class="required"> *</span></label
        >
        <textarea id="message" name="message" required></textarea>
        <p>Geef je vraag of suggestie op</p>

        <button type="submit">Indienen</button>
      </form>
    </div>
  </body>
</html>
