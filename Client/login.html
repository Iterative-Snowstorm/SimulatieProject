<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studiegids - Home</title>
    <link rel="stylesheet" href="./style/style.css" />
    <script type="text/javascript" src="./script/darkmode.js" defer></script>
    <script type="text/javascript" src="./script/quote.js" defer></script>
    <script type="text/javascript" src="./script/language.js" defer></script>
  </head>
  <body>
    <!-- Feature: Darkmode Switch -->
    <button id="theme-switch">
      <!-- Dark Mode Icon -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="24px"
        viewBox="0 -960 960 960"
        width="24px"
        fill="#FFFFFF"
      >
        <path
          d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z"
        />
      </svg>
      <!-- Light Mode Icon-->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="24px"
        viewBox="0 -960 960 960"
        width="24px"
        fill="#FFFFFF"
      >
        <path
          d="M480-360q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35Zm0 80q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Zm326-268Z"
        />
      </svg>
    </button>
    <header>
      <!-- Top navigation bar with support branding -->
      <div class="navigation__top-bar">
        <div class="top-bar__container">
          <!-- Login Section -->
          <div class="auth-section">
            <div class="user-icon">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <span class="login-text">
              <a href="login.html">Inloggen</a>
            </span>
          </div>
          <!-- Language Section -->
          <div class="language-section">
            <svg
              class="flag nl-flag active"
              viewBox="0 0 640 480"
              xmlns="http://www.w3.org/2000/svg"
            >
              <!-- Nederlandse vlag -->
              <g fill-rule="evenodd" stroke-width="1pt">
                <rect width="640" height="480" fill="#fff" rx="0" ry="0" />
                <rect
                  width="640"
                  height="160"
                  y="320"
                  fill="#21468b"
                  rx="0"
                  ry="0"
                />
                <rect width="640" height="160" fill="#ae1c28" rx="0" ry="0" />
              </g>
            </svg>

            <!-- Engelse vlag (UK) -->
            <svg
              class="flag en-flag"
              viewBox="0 0 640 480"
              xmlns="http://www.w3.org/2000/svg"
            >
              <!-- UK vlag -->
              <rect width="640" height="480" fill="#012169" />
              <path
                d="M75 0l244 181L562 0h78v62L400 241l240 178v61h-80L320 301 81 480H0v-60l239-178L0 64V0h75z"
                fill="#FFF"
              />
              <path
                d="M424 281l216 159v40L369 281h55zm-184 20l6 35L54 480H0l240-179zM640 0v3L391 191l2-44L590 0h50zM0 0l239 176h-60L0 42V0z"
                fill="#C8102E"
              />
              <path
                d="M241 0v480h160V0H241zM0 160v160h640V160H0z"
                fill="#FFF"
              />
              <path
                d="M0 193v96h640v-96H0zM273 0v480h96V0h-96z"
                fill="#C8102E"
              />
            </svg>
          </div>
        </div>
      </div>
      <div class="container">
        <!-- Main Navigation Bar -->
        <nav aria-label="Main Navigation">
          <!-- Site Branding (Logo or Name) -->
          <div>
            <a class="site-branding-logo" href="index.html">📚 StudentBuddy</a>
          </div>
          <!-- Navigation Menu with links to different sections of the site -->
          <div>
            <ul>
              <li>
                <a href="index.html">Home</a>
              </li>
              <li>
                <a href="studie-tips.html">Studie Tips</a>
              </li>
              <li>
                <a href="ontspanning-tips.html">Ontspanning Tips</a>
              </li>
              <li>
                <a href="studie-tools.html">Studie Tools</a>
              </li>
              <li>
                <a href="contact.html">Contact</a>
              </li>
            </ul>
          </div>
        </nav>
      </div>
    </header>
    <main class="form-wrapper">
      <div class="container">
        <h1 class="form-title">Inloggen bij StudentBuddy</h1>
        <form action="#" method="post">
          <!-- Email -->
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <!-- Password -->
          <div>
            <label for="form-group">Wachtwoord</label>
            <input type="password" name="pasword" id="password" required />
          </div>
          <!-- Login Button -->
          <button type="submit" class="form-btn">Inloggen</button>
          <div class="or-divider">
            <span>OF</span>
          </div>

          <a href="#" class="form-btn-secondary" id="guest-login"
            >Doorgaan als gast</a
          >

          <p class="guest-mode-info">
            In gastmodus kun je StudentBuddy gebruiken, <br />
            maar je voortgang wordt niet opgeslagen.
          </p>
        </form>
      </div>
    </main>
  </body>
</html>
